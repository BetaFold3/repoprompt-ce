name: Agent Context

on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - docs/context/**
      - Scripts/check-agent-context
      - Scripts/test-check-agent-context
      - .githooks/pre-commit
      - Scripts/guardrails.sh
      - Scripts/source_layout_guardrails.sh
      - .github/workflows/agent-context.yml

jobs:
  structural-integrity:
    name: Structural Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check agent context structure
        run: Scripts/check-agent-context

      - name: Negative-test the structural checker
        run: Scripts/test-check-agent-context
